{% extends "layout.html" %}
{% block title %}Create account{% endblock %}

{% block content %}
<h1>Create your Sharpnr account</h1>
{% if let Some(message) = error %}<p class="error">{{ message }}</p>{% endif %}
<form method="post" action="/signup">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  {% if let Some(return_to) = return_to %}<input type="hidden" name="return_to" value="{{ return_to }}">{% endif %}
  <label for="email">Email</label>
  <input id="email" type="email" name="email" value="{{ email }}" autocomplete="username" required>
  <label for="display_name">Display name (optional)</label>
  <input id="display_name" type="text" name="display_name" value="{{ display_name }}" autocomplete="name">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
  <button>Create account</button>
</form>
<p class="muted">Already have an account? <a href="/signin{{ return_to_query }}">Sign in</a>.</p>
{% endblock %}
